services:
  feedlr-migrate:
    build:
      dockerfile: Dockerfile.migrate
    pull_policy: always
    command: "migrate apply --allow-dirty --dir 'file:///migrations' --tx-mode all --url 'sqlite://${DATABASE_PATH}?_fk=1'"
    volumes:
      - ${DATABASE_DIR}:/data
    networks:
      - dokploy-network

  feedlr-service:
    build:
      dockerfile: Dockerfile
    environment:
      - PORT=3000 # the port does not matter, but it needs to match Traefik labels. we set it here explicitly in order to avoid any issues
      - NATIVE_PLAYBACK_ENABLED=${NATIVE_PLAYBACK_ENABLED:-true}
      - COMPANION_URL=${COMPANION_URL:-http://companion:8282}
      - COMPANION_SECRET=${COMPANION_SECRET:-}
    volumes:
      - ${DATABASE_DIR}:/data
    restart: always
    depends_on:
      feedlr-migrate:
        condition: service_completed_successfully
    networks:
      - dokploy-network
      - playback

  companion:
    image: quay.io/invidious/invidious-companion:latest
    profiles: [native]
    environment:
      HOST: 0.0.0.0
      PORT: 8282
      SERVER_SECRET_KEY: ${COMPANION_SECRET:-}
      SERVER_VERIFY_REQUESTS: "true"
    restart: always
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - companion-cache:/var/tmp/youtubei.js:rw
    networks:
      - playback
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  dokploy-network:
    external: true
  playback:
    driver: bridge

volumes:
  companion-cache:
