root = "."
tmp_dir = "tmp"

[build]
bin = "./tmp/main"
cmd = "go build -tags dev -o ./tmp/main ."
delay = 1000
exclude_dir = ["node_modules", "web", "assets/ui", "assets/vendor", "tmp", "vendor", ".git"]
exclude_file = []
exclude_regex = []
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = []
include_ext = ["go", "js", "css", "webmanifest"]
kill_delay = "0s"
log = "build-errors.log"
send_interrupt = false
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false

[misc]
clean_on_exit = false
