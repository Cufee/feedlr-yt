version: 3

# User by --watch
interval: "500ms"

dotenv: [".env"]
vars:
  DATABASE_PATH: $DATABASE_PATH
  COMMIT_ID:
    sh: git rev-parse --short HEAD || echo "unknown"

tasks:
  dev:
    desc: Run Companion, Go hot reload, and React hot updates; open the Go URL
    deps: [dev:companion]
    cmds:
      - npm run dev

  dev:companion:
    desc: Start local Companion at COMPANION_URL and wait until ready
    cmds:
      - node scripts/dev-companion.mjs start

  dev:companion:stop:
    desc: Stop local Companion (preserves its cache)
    cmds:
      - node scripts/dev-companion.mjs stop

  dev:go:
    desc: Run Go hot reload with React served by a separate Vite process
    env:
      FEEDLR_VITE_URL: '{{.FEEDLR_VITE_URL | default "http://127.0.0.1:5173"}}'
    cmds:
      - air

  dev:web:
    desc: Run Vite separately (normally managed by task dev)
    cmds:
      - npm run dev:web

  test:
    desc: Run player runtime, frontend unit, and isolated Go tests
    cmds:
      - npm test
      - env -u DATABASE_PATH -u FEEDLR_INTEGRATION_TESTS go test . ./internal/...

  check:
    desc: Check schema drift, strict frontend style, build, Go races, and browser stories
    cmds:
      - npm run check

  frontend:build:
    desc: Build the React app and local browser assets for Go embedding
    cmds:
      - npm run build

  storybook:
    desc: Preview components and screens at mobile and desktop sizes
    cmds:
      - npm --prefix web run storybook

  storybook:build:
    desc: Build the component preview outside embedded application assets
    cmds:
      - npm run build:storybook

  upgrade:
    desc: Upgrade dependencies
    cmds:
      - go get -u ./...
  generate:
    desc: Generate database models from the migrated SQLite schema
    env:
      SQLITE3_DBNAME: "{{.DATABASE_PATH}}"
    cmds:
      - go build -o tmp/bin/sqlboiler-sqlite3 github.com/aarondl/sqlboiler-sqlite3
      - go tool sqlboiler tmp/bin/sqlboiler-sqlite3

  migrate:
    desc: generate migrations
    cmd: atlas migrate hash --dir "file://internal/database/migrations" && atlas migrate diff {{.CLI_ARGS}} --dir "file://internal/database/migrations" --to file://schema.hcl --dev-url "sqlite://file?mode=memory&_fk=1"
  migrate-apply:
    desc: apply migrations using atlas
    cmds:
      # variables will be pulled from global vars declaration unless overwritten in the task call
      - echo "Applying migrations to {{.DATABASE_PATH}}"
      - atlas migrate apply --allow-dirty --dir "file://internal/database/migrations" --tx-mode all --url "sqlite://{{.DATABASE_PATH}}?_fk=1"
      - task: generate

  build:fast:
    desc: Build the application from existing generated Go and frontend assets
    env:
      BUILD_MODE: true
    cmds:
      - go build -trimpath -ldflags '-s -w' -o {{ .CLI_ARGS | default "app" }} .
  build:full:
    desc: Build React and its local player runtime, then compile the Go application
    aliases: [build]
    deps: [frontend:build]
    cmds:
      - task: build:fast
  build:docker:
    desc: Build the application for Docker
    cmds:
      - task: build:image
  build:image:
    desc: Build the Docker image
    cmds:
      - docker build --progress=plain --platform linux/amd64 -t {{ .CLI_ARGS | default "github.com/cufee/feedlr-yt" }} .
